name: CI Pipeline

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Lint, Typecheck and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Code Formatting
        run: pnpm run format

      - name: Run ESLint
        run: pnpm run lint

      - name: Run TypeScript Typecheck
        run: pnpm run typecheck

      - name: Run Automated Tests
        run: pnpm run test

      - name: Build Workspace Applications
        run: pnpm run build

      - name: Typecheck Mobile App
        run: pnpm --filter @schoolerp/mobile typecheck

  database-migrations:
    name: Validate PostgreSQL Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: schoolerp
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: schoolerp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schoolerp -d schoolerp_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to a clean PostgreSQL database
        run: pnpm --filter @schoolerp/api migration:run
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://schoolerp:ci_password@localhost:5432/schoolerp_ci

  container-build:
    name: Build API Container Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: schoolerp-api:ci

  security-scans:
    name: Security Scans (Gitleaks, Semgrep, Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Semgrep SAST Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: p/default

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check production dependency advisories
        run: pnpm audit --prod --audit-level high
